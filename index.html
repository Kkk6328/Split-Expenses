<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#344b63"><title>分帳｜共同記帳與費用結算</title><link rel="stylesheet" href="style.css?v=20261107-dates1"><script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script><script src="config.js?v=20261107-dates1" defer></script><script src="app.js?v=20261107-dates1" defer></script><script src="migration.js?v=20261107-dates1" defer></script><script src="line-cloud.js?v=20261107-dates1" defer></script><script type="module" src="cloud.js?v=20261107-dates1"></script></head><body>
<header><a class="brand" href="./"><span class="brand-mark">÷</span><span>分帳<small>共同記帳 · 費用結算</small></span></a><div><span id="status" class="pill">尚未登入</span> <button id="login" class="quiet">LINE 登入</button> <button id="cloudLogin" class="quiet">Google 共用登入</button></div></header>
<main><section class="welcome"><div><p class="eyebrow">EXPENSE MANAGER</p><h1>共同記帳，清楚分帳。</h1><p>記錄付款、設定匯率與分攤對象，集中管理每個帳本的費用。</p></div><button id="newGroup">＋ 建立帳本</button></section>
<div class="workspace"><aside><div class="aside-title">我的帳本 <span id="groupCount"></span></div><div id="groups"></div><div class="note">帳本管理<p id="storageNote">每本帳本各自管理成員，僅顯示你已加入的帳本。</p></div><details class="side-tools"><summary>帳本管理</summary><div><button id="trash" class="quiet">已刪除帳本</button><button id="migration" class="quiet">匯入舊帳本</button><button id="settings" class="quiet">使用說明</button></div></details></aside>
<section class="book"><div id="empty" class="empty"><div class="empty-symbol">▤</div><h2 id="emptyTitle">登入後查看帳本</h2><p>登入 LINE 建立帳本，邀請朋友加入後即可分攤費用。</p><button id="emptyCreate">建立帳本</button></div><div id="book" hidden><div class="book-head"><div><p class="eyebrow" id="bookMeta"></p><h2 id="bookTitle"></h2></div><div><button id="invite">邀請成員</button><details class="book-menu"><summary aria-label="更多帳本操作">•••</summary><div class="menu-panel"><button id="refresh" class="quiet">同步最新資料</button><button id="export" class="quiet">匯出 CSV</button><button id="revokeInvites" class="quiet">停用既有邀請</button><button id="deleteBook" class="quiet danger">刪除帳本</button></div></details></div></div><div class="stats"><div><small>共同花費</small><strong id="total"></strong></div><div><small>分攤成員</small><strong id="memberCount"></strong></div><div><small>已記錄</small><strong id="expenseCount"></strong></div></div><nav><button data-tab="expenses" class="active">花費明細</button><button data-tab="balances">分帳結算</button><button data-tab="members">成員</button></nav><div class="toolbar"><span id="viewHint">費用紀錄與換算明細</span><button id="addExpense">＋ 記一筆</button></div><div id="content"></div><div class="book-footer"><span>依每筆費用的匯率換算為 TWD</span></div></div></section></div></main><footer>分帳 <span>共同記帳與費用結算。</span></footer>
<dialog id="modal"><form id="form"><div class="dialog-head"><h2 id="dialogTitle"></h2><button type="button" id="close" class="quiet" aria-label="關閉">✕</button></div><div id="fields"></div><div id="formError" role="alert"></div><button id="submit" type="submit">儲存</button></form></dialog><div id="toast" role="status"></div><script src="media.js?v=20261107-dates1" defer></script>
</body></html>
